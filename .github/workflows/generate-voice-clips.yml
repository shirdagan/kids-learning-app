name: Generate Hebrew Voice Clips

# הפעלה ידנית בלבד (כפתור "Run workflow" בלשונית Actions) - לא רץ
# אוטומטית על כל push, כי זה עולה כסף (זעיר, אבל בכל זאת) ומיועד
# לריצה מכוונת כשרוצים להוסיף/לעדכן הקלטות.
on:
  workflow_dispatch:
    inputs:
      voice_name:
        description: >-
          שם קול ספציפי מ-Google TTS (למשל he-IL-Wavenet-C). ריק = בוחר
          אוטומטית את הקול הכי טוב הזמין.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kids_reading_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/learning-app-children-rg02ds

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate voice clips
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          VOICE_NAME: ${{ inputs.voice_name }}
        run: python scripts/generate_voice_clips.py

      - name: Commit and push generated clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/audio/voice/he/
          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Add generated Hebrew voice clips"
            git push
          fi
