name: Fetch Animal Sounds

# הפעלה ידנית בלבד (כפתור "Run workflow" בלשונית Actions) - מחפש
# ומוריד קולות חיה אמיתיים (לא TTS) עבור כל חיה שעדיין אין לה קובץ,
# מוויקישיתוף (Wikimedia Commons - ציבורי, בלי מפתח API) - ראו
# scripts/fetch_animal_sounds.py.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kids_reading_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/learning-app-children-rg02ds

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch animal sound clips
        run: python scripts/fetch_animal_sounds.py

      - name: Commit and push fetched clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/audio/animal_sounds/
          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Add fetched animal sound clips"
            git push
          fi
